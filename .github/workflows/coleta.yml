# Coletor diário (T-10, T-57, T-58; specs/plan.md, seção 5; ADR-001, ADR-007, ADR-008).
# Grava o bruto do dia na branch dados-raw com o GITHUB_TOKEN (contents: write)
# e TCG_USER_AGENT vindo de vars. Depois do push, sincroniza a branch com o
# data lake da turma (RustFS). Os secrets MINIO_* aparecem só no env do passo
# de sincronização, nunca dentro de run nem em echo.
name: coleta

on:
  # Principal às 20h30 UTC e reserva às 06h30 UTC (ADR-007). As duas caem no
  # mesmo ciclo do TCGCSV e gravam a mesma data de referência; a reserva só
  # requisita os arquivos que ainda faltarem.
  schedule:
    - cron: "30 20 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-dados-raw
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TCG_USER_AGENT: ${{ vars.TCG_USER_AGENT }}
    steps:
      - name: checkout do código (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: codigo
          persist-credentials: false

      - name: checkout do bruto (dados-raw)
        uses: actions/checkout@v4
        with:
          ref: dados-raw
          path: dados

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: instalar o pacote
        run: python -m pip install -e ./codigo

      - name: coletar
        id: coleta
        working-directory: codigo
        run: |
          set +e
          python -m tcg.coleta --destino ../dados
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      # Código 0 (tudo gravado ou já existente) ou 1 (falha parcial):
      # publica o que foi gravado. Código 2 (destino inexistente): nada a commitar.
      - name: publicar na dados-raw
        id: publicar
        if: steps.coleta.outputs.codigo == '0' || steps.coleta.outputs.codigo == '1'
        working-directory: dados
        run: |
          set -euo pipefail
          if [ ! -d raw ]; then
            echo "nenhum arquivo gravado; nada a commitar"
            exit 0
          fi
          git add raw
          if git diff --cached --quiet; then
            echo "nenhum arquivo novo; nada a commitar"
            exit 0
          fi
          datas=$(git diff --cached --name-only | sed -n 's|.*/data=\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)/.*|\1|p' | sort -u)
          if [ "$(printf '%s\n' "$datas" | grep -c .)" -ne 1 ]; then
            echo "erro: esperada uma única data nos arquivos novos, encontrado: $datas" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dados(coleta): $datas [RF-01]"
          git push origin HEAD:refs/heads/dados-raw

      # ADR-008: com código 0 ou 1 e a publicação concluída, envia ao data lake da
      # turma cada arquivo da dados-raw ainda ausente, mesmo sem arquivo novo, para
      # recuperar uma falha do dia anterior. Chave existente é recusada, nunca
      # regravada. Uma falha aqui marca o job como falho, mas o push acima fica.
      - name: sincronizar com o data lake da turma
        if: (steps.coleta.outputs.codigo == '0' || steps.coleta.outputs.codigo == '1') && steps.publicar.outcome == 'success'
        working-directory: codigo
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_SECURE: "true"
          MINIO_BUCKET: tcg
          GROUP_ID: "24269"
        run: python -m tcg.sync.sincronizador --repo ../dados

      - name: resultado da coleta
        if: always()
        env:
          CODIGO: ${{ steps.coleta.outputs.codigo }}
        run: |
          echo "código de saída do coletor: ${CODIGO:-ausente}"
          if [ "${CODIGO:-}" != "0" ]; then
            exit "${CODIGO:-1}"
          fi
